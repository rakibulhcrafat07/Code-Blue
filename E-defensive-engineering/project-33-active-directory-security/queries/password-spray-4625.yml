title: Password Spraying - Many Accounts Failing from One Source
id: cb33-spray-4625
status: experimental
description: A single source failing authentication against many distinct usernames in a short window (low-and-slow spray). Implement as a SIEM threshold rule.
logsource:
  product: windows
  service: security
detection:
  selection_logon:
    EventID: 4625          # failed logon
  selection_krb:
    EventID: 4771          # Kerberos pre-auth failed
  timeframe: 15m
  condition: (selection_logon or selection_krb) | count(TargetUserName) by IpAddress > 15
fields: [IpAddress, TargetUserName, WorkstationName]
falsepositives:
  - A misconfigured service with stale creds hammering many accounts (investigate either way)
level: high
tags: [attack.credential_access, attack.t1110.003]
