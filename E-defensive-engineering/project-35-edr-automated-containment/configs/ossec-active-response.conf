<!-- Wazuh manager: ossec.conf active-response blocks -->
<!-- Each <command> defines a script; each <active-response> ties it to a rule/level -->

<!-- 1) Kill a malicious process (high-confidence malware rule) -->
<command>
  <name>kill-process</name>
  <executable>kill-process.sh</executable>   <!-- or .cmd on Windows agents -->
  <timeout_allowed>no</timeout_allowed>
</command>
<active-response>
  <command>kill-process</command>
  <location>local</location>
  <rules_id>100210</rules_id>                 <!-- custom: verified-malware execution -->
</active-response>

<!-- 2) Block a known-bad / brute-force source IP (temporary, self-expiring) -->
<command>
  <name>firewall-drop</name>
  <executable>firewall-drop</executable>      <!-- built-in Wazuh AR -->
  <timeout_allowed>yes</timeout_allowed>
</command>
<active-response>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>5712,100310</rules_id>            <!-- sshd brute force, C2-IP match -->
  <timeout>1800</timeout>                      <!-- auto-unblock after 30 min -->
</active-response>

<!-- 3) Isolate the host on ransomware behaviour (manual rollback) -->
<command>
  <name>isolate-host</name>
  <executable>isolate-host.sh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>
<active-response>
  <command>isolate-host</command>
  <location>local</location>
  <rules_id>100486</rules_id>                 <!-- custom: ransomware behaviour -->
</active-response>

<!-- 4) Disable a newly-created off-hours admin account (reversible) -->
<command>
  <name>disable-account</name>
  <executable>disable-account.sh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>
<active-response>
  <command>disable-account</command>
  <location>local</location>
  <rules_id>100472</rules_id>                 <!-- custom: new admin off-hours -->
</active-response>
