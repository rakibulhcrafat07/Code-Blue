# crs-setup.conf — OWASP Core Rule Set tuning (the two dials that matter)

# --- Paranoia level (sensitivity). Start at 1, raise one level at a time. ---
SecAction "id:900000,phase:1,nolog,pass,t:none,\
  setvar:tx.paranoia_level=1"

# Executing paranoia level: only report (not block) rules above this level,
# so you can preview PL2+ noise before committing.
SecAction "id:900001,phase:1,nolog,pass,t:none,\
  setvar:tx.executing_paranoia_level=1"

# --- Anomaly score thresholds (cumulative points before action). ---
# Lower = stricter. 5 inbound / 4 outbound are the CRS defaults.
SecAction "id:900110,phase:1,nolog,pass,t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# --- Early blocking (optional): act at end of phase 1 instead of phase 2 ---
SecAction "id:900120,phase:1,nolog,pass,t:none,\
  setvar:tx.early_blocking=0"
