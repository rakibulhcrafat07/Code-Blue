# modsecurity.conf — main ModSecurity v3 engine settings (annotated for learning)

# --- Engine mode ---
# DetectionOnly = evaluate + log, never block (start here).
# On = block requests over the anomaly threshold.  Off = disabled.
SecRuleEngine DetectionOnly

# --- Request body inspection ---
# Needed to catch SQLi/XSS inside POST form data and JSON.
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# --- Response body inspection (catch data leaks / outbound anomalies) ---
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576

# --- Audit logging (this is what you read + ship to the SIEM) ---
SecAuditEngine RelevantOnly          # log only requests that matched a rule
SecAuditLogParts ABIJDEFHZ           # which parts of the transaction to record
SecAuditLogType Serial
SecAuditLogFormat JSON               # JSON = clean SIEM parsing
SecAuditLog /var/log/modsec_audit.log

# --- Misc ---
SecDefaultAction "phase:1,log,auditlog,pass"
SecArgumentSeparator &
SecCookieFormat 0
SecTmpDir /tmp/
SecDataDir /tmp/
