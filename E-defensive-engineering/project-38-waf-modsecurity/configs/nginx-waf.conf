# nginx-waf.conf — Nginx reverse proxy that runs ModSecurity and forwards to DVWA
load_module modules/ngx_http_modsecurity_module.so;

events {}
http {
  server {
    listen 8080;
    server_name _;

    # Turn ModSecurity on for this server and load the rules entrypoint
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;   # includes modsecurity.conf + crs-setup.conf + CRS rules

    location / {
      proxy_pass http://127.0.0.1:80;      # the DVWA backend
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
# /etc/nginx/modsec/main.conf should:
#   Include /etc/nginx/modsec/modsecurity.conf
#   Include /etc/nginx/modsec/crs-setup.conf
#   Include /etc/nginx/modsec/rules/*.conf        (the OWASP CRS rule files)
